name: 'Basic Install'
description: 'Sets up Node.js and runs install'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        # version 미지정 시 package.json의 "packageManager" 필드(pnpm@11.5.0)를 자동으로 사용합니다.
        # pnpm-lock.yaml이 lockfileVersion 9.0(pnpm 9+ 전용) 포맷이라 pnpm 8로 고정하면 install이 깨집니다.
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        # pnpm 11은 Node >=22.13 을 요구합니다.
        node-version: '22'
        cache: 'pnpm'

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Setup Git User
      shell: bash
      run: |
        git config --global user.email "fe-system@toktokhan.dev"
        git config --global user.name "ToktokhanDev-FE"

    - name: install dependencies
      shell: bash
      run: pnpm install
